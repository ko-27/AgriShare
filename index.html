<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgriShare</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="login-body light-mode">
    <div class="login-wrapper">
        <div class="login-left">
            <div class="login-brand">
                <i class="fa-solid fa-tractor logo-icon-large"></i>
                <h1>AgriShare</h1>
                <p>Empowering Farmers Through Shared Resources</p>
            </div>
        </div>
        <div class="login-right">
            <div class="login-form-container">
                <h2>Welcome Back</h2>
                <p class="login-subtitle">Sign in to your dashboard</p>
                
                <form id="loginForm" action="dashboard.html" method="GET">
                    <div class="form-group">
                        <label for="email">Email / Username <span class="req">*</span></label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="email" required placeholder="admin@agrishare.com" value="admin@agrishare.com">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password <span class="req">*</span></label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" required placeholder="Enter password" value="password">
                        </div>
                    </div>
                    
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" checked> Remember Me
                        </label>
                        <a href="#" class="forgot-pwd">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block btn-lg bounce">Login to Dashboard</button>
                    
                    <div class="auth-divider"><span>OR</span></div>
                    
                    <button type="button" class="btn btn-outline btn-block bounce">Register as New Farmer</button>
                    
                    <div class="login-footer">
                        <p>&copy; 2026 AgriShare.</p>
                        <p>Designed  by Kohila M</p>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="script.js?v=2"></script>
</body>
</html>
